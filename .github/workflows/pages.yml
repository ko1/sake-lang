# Publishes the reference manual (docs/manual, a ligarb book) and docs/guide.html to GitHub Pages.
# The site is static: no Jekyll (the repository's Markdown holds `{{`, which Liquid would misread).
# Pages must be set to "Source: GitHub Actions" in the repository settings.
name: pages

on:
  push:
    branches: [main]
    paths: [docs/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Install ligarb
        run: gem install ligarb -v 0.11.0 --no-document
      - name: Build the manual
        run: sh docs/manual/build.sh
      - name: Assemble the site
        run: |
          rm -rf _site
          cp -r docs/manual/build _site
          cp docs/guide.html _site/guide.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
