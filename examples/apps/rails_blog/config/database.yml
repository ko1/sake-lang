# SQLite. Versions 3.8.0 and up are supported.
# (Rails writes a `default: &default` anchor merged into each environment; sakelib's YAML has no anchors)
development:
  adapter: sqlite3
  timeout: 5000
  database: storage/development.sqlite3

test:
  adapter: sqlite3
  timeout: 5000
  database: storage/test.sqlite3

production:
  adapter: sqlite3
  timeout: 5000
  database: storage/production.sqlite3
