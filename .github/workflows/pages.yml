# Publishes README.md (the front page), the reference manual (docs/manual, a ligarb book),
# docs/guide.html and the playground (ide/, built with npm) to GitHub Pages; tools/gen_site.rb
# assembles them. The site is static: no Jekyll (the repository's Markdown holds `{{`, which
# Liquid would misread). Pages must be set to "Source: GitHub Actions" in the repository settings.
name: pages

on:
  push:
    branches: [main]
    paths: [README.md, docs/**, ide/**, lib/**, sakelib/**, test/sakelib/**, tools/gen_site.rb, tools/gen_compare.rb, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Install ligarb
        run: gem install ligarb -v 0.11.0 --no-document
      - name: Build the manual
        run: sh docs/manual/build.sh
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ide/package-lock.json
      - name: Build the playground
        run: npm ci && npm run build
        working-directory: ide
      - name: Assemble the site (README as the front page, manual/, guide.html, playground/)
        run: ruby tools/gen_site.rb _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
